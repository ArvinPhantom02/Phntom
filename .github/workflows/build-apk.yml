name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: unzip -o PhantomAIVision-guard.zip
      - name: Download model
        run: |
          mkdir -p PhantomAIVision/app/src/main/assets
          curl -L -o PhantomAIVision/app/src/main/assets/efficientdet_lite0.tflite https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite
      - name: Build
        working-directory: PhantomAIVision
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PhantomAIVision-apk
          path: PhantomAIVision/app/build/outputs/apk/debug/*.apk
