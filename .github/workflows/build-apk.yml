name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE: https://storage.googleapis.com/mediapipe-models
      MODEL: object_detector/efficientdet_lite0/float16/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: unzip -o PhantomAIVision-guard.zip
      - name: Download model
        run: |
          D=PhantomAIVision/app/src/main/assets
          mkdir -p $D
          curl -L -o $D/efficientdet_lite0.tflite $BASE/$MODEL/efficientdet_lite0.tflite
      - name: Build
        working-directory: PhantomAIVision
        run: gradle assembleDebug
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: PhantomAIVision/app/build/outputs/apk/debug/app-debug.apk
